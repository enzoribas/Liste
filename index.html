<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liste Cadeaux</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font-family: inherit; }
    input, select, textarea { font-family: inherit; }
    ::placeholder { color: inherit; opacity: 0.5; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCJPpjyj3HAIoQhVzTW136z9RfdVS7uCA0",
      authDomain: "liste-cadeaux-eb4f4.firebaseapp.com",
      projectId: "liste-cadeaux-eb4f4",
      storageBucket: "liste-cadeaux-eb4f4.firebasestorage.app",
      messagingSenderId: "709606688470",
      appId: "1:709606688470:web:51aee7565f4d44ced3eb77",
      measurementId: "G-2V619QLTQP"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ---------- PALETTE ----------
    const LIGHT = {
      bg: "#FBF6EF",
      card: "#FFFFFF",
      cardMuted: "#F5F0E6",
      ink: "#2E2A25",
      sub: "#8A8072",
      muted: "#B6AC9C",
      rose: "#C6584F",
      roseSoft: "#F4E1DD",
      roseText: "#8C3830",
      pine: "#3F5B4E",
      pineSoft: "#E1EAE3",
      pineText: "#2A4038",
      gold: "#B9862E",
      goldSoft: "#F3E9D2",
      goldText: "#7A5A1E",
      line: "#E6DCCB",
      overlay: "rgba(46,42,37,0.92)",
    };
    const DARK = {
      bg: "#211E1A",
      card: "#2B2723",
      cardMuted: "#332E28",
      ink: "#F2EEE6",
      sub: "#B0A797",
      muted: "#77705F",
      rose: "#E0847A",
      roseSoft: "#3D2C29",
      roseText: "#F0AFA8",
      pine: "#8FB09E",
      pineSoft: "#25302A",
      pineText: "#A9CBB9",
      gold: "#D9AD5C",
      goldSoft: "#382E1C",
      goldText: "#E4C084",
      line: "#40392F",
      overlay: "rgba(0,0,0,0.92)",
    };

    const THEME_HUES = ["rose", "pine", "gold"];
    function themeFor(style, name) {
      if (!name) return { main: style.sub, soft: style.cardMuted, text: style.sub };
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const hue = THEME_HUES[Math.abs(hash) % THEME_HUES.length];
      const map = {
        rose: { main: style.rose, soft: style.roseSoft, text: style.roseText },
        pine: { main: style.pine, soft: style.pineSoft, text: style.pineText },
        gold: { main: style.gold, soft: style.goldSoft, text: style.goldText },
      };
      return map[hue];
    }

    const STATUT_ICON = { idee: "ti-bulb", commande: "ti-shopping-cart", offert: "ti-gift", abandonne: "ti-x" };
    const STATUT_LABEL = { idee: "Idée", commande: "Commandé", offert: "Offert", abandonne: "Abandonné" };

    function Icon({ name, size = 15, style }) {
      return <i className={"ti " + name} style={{ fontSize: size, lineHeight: 1, ...style }} aria-hidden="true" />;
    }

    // ---------- MENU D'ACTIONS (kebab) ----------
    function ActionMenu({ style, actions }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        if (!open) return;
        function onClick(e) {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener("mousedown", onClick);
        return () => document.removeEventListener("mousedown", onClick);
      }, [open]);

      const visibleActions = actions.filter(Boolean);
      if (visibleActions.length === 0) return null;

      return (
        <div ref={ref} style={{ position: "relative", flexShrink: 0 }}>
          <button
            aria-label="Options"
            onClick={() => setOpen(o => !o)}
            style={{
              border: "none",
              background: "rgba(0,0,0,0.32)",
              color: "#fff",
              borderRadius: 999,
              width: 26,
              height: 26,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              cursor: "pointer",
            }}
          >
            <Icon name="ti-dots" size={15} />
          </button>
          {open && (
            <div style={{
              position: "absolute",
              top: 30,
              right: 0,
              background: style.card,
              border: `1px solid ${style.line}`,
              borderRadius: 10,
              boxShadow: "0 6px 20px rgba(0,0,0,0.16)",
              minWidth: 160,
              overflow: "hidden",
              zIndex: 20,
            }}>
              {visibleActions.map((a, i) => (
                <button
                  key={i}
                  onClick={() => { setOpen(false); a.onClick(); }}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                    width: "100%",
                    border: "none",
                    background: "transparent",
                    color: a.danger ? style.rose : style.ink,
                    padding: "9px 12px",
                    fontSize: 13,
                    textAlign: "left",
                    cursor: "pointer",
                  }}
                  onMouseEnter={e => e.currentTarget.style.background = style.cardMuted}
                  onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                >
                  <Icon name={a.icon} size={15} />
                  {a.label}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ---------- CHIP (bouton pill réutilisable) ----------
    function Chip({ active, onClick, children, style, dashed, small }) {
      return (
        <button onClick={onClick} style={{
          border: dashed ? `1px dashed ${style.line}` : `1px solid ${active ? style.rose : style.line}`,
          borderRadius: 999,
          padding: small ? "4px 11px" : "7px 15px",
          fontSize: small ? 12 : 13,
          fontWeight: 500,
          cursor: "pointer",
          background: active ? style.rose : "transparent",
          color: active ? "#fff" : (dashed ? style.sub : style.ink),
          display: "inline-flex",
          alignItems: "center",
          gap: 6,
          whiteSpace: "nowrap",
        }}>{children}</button>
      );
    }

    // ---------- GIFT CARD ----------
    function GiftTag({ item, onDelete, onToggleVisible, onOpenPhoto, currentUser, onEdit, onMove, onReserver, onAddComment, inputStyle, style }) {
      const theme = themeFor(style, item.pour);
      const isForMe = item.pour === currentUser;
      const hiddenFromRecipient = item.visible === false;
      const isReserved = item.reservePar && item.reservePar !== currentUser;
      const isReservedByMe = item.reservePar === currentUser;
      const isAuthor = item.creePar === currentUser;
      const [commentDraft, setCommentDraft] = useState("");

      function submitComment() {
        const v = commentDraft.trim();
        if (!v) return;
        onAddComment(item.id, v);
        setCommentDraft("");
      }

      if (hiddenFromRecipient && isForMe) {
        return (
          <div style={{
            background: style.card,
            borderRadius: 14,
            border: `1px solid ${style.line}`,
            padding: 20,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 6,
            minHeight: 160,
            textAlign: "center",
          }}>
            <Icon name="ti-gift" size={26} style={{ color: style.muted }} />
            <div style={{ fontSize: 13, fontWeight: 500, color: style.ink }}>Une idée pour toi</div>
            <div style={{ fontSize: 12, color: style.sub }}>{item.creePar || "Quelqu'un"} a pensé à toi</div>
            {isAuthor && (
              <button onClick={() => onDelete(item.id)} style={{
                marginTop: 6, background: "transparent", border: "none", color: style.muted, cursor: "pointer", fontSize: 12,
              }}>Retirer</button>
            )}
          </div>
        );
      }

      const photos = item.photos && item.photos.length > 0 ? item.photos : (item.photo ? [item.photo] : []);

      const actions = [
        !isForMe && !isReserved && !isReservedByMe && { icon: "ti-shopping-cart", label: "Réserver", onClick: () => onReserver(item.id) },
        isReservedByMe && { icon: "ti-shopping-cart-x", label: "Annuler la réservation", onClick: () => onReserver(item.id) },
        !isForMe && { icon: hiddenFromRecipient ? "ti-eye" : "ti-eye-off", label: hiddenFromRecipient ? "Rendre visible" : "Cacher (surprise)", onClick: () => onToggleVisible(item.id) },
        isAuthor && { icon: "ti-edit", label: "Modifier", onClick: () => onEdit(item) },
        { icon: "ti-arrow-up", label: "Monter", onClick: () => onMove(item.id, -1) },
        { icon: "ti-arrow-down", label: "Descendre", onClick: () => onMove(item.id, 1) },
        isAuthor && { icon: "ti-trash", label: "Supprimer", onClick: () => onDelete(item.id), danger: true },
      ];

      return (
        <div style={{
          background: style.card,
          borderRadius: 14,
          border: `1px solid ${style.line}`,
          overflow: "hidden",
          display: "flex",
          flexDirection: "column",
        }}>
          <div style={{ position: "relative", height: 130, background: theme.soft, display: "flex", alignItems: "center", justifyContent: "center" }}>
            {photos.length > 0 ? (
              <img src={photos[0]} alt={item.titre} style={{ width: "100%", height: "100%", objectFit: "cover", cursor: "zoom-in" }}
                onClick={() => onOpenPhoto(photos[0], item.titre)}
                onError={(e) => { e.target.style.display = "none"; }} />
            ) : (
              <Icon name="ti-gift-card" size={30} style={{ color: theme.main }} />
            )}
            {photos.length > 1 && (
              <span style={{ position: "absolute", bottom: 8, right: 8, background: "rgba(0,0,0,0.45)", color: "#fff", fontSize: 11, padding: "2px 7px", borderRadius: 999 }}>
                +{photos.length - 1}
              </span>
            )}
            <span style={{
              position: "absolute", top: 8, left: 8,
              fontSize: 11, fontWeight: 600, letterSpacing: 0.2,
              color: theme.text, background: style.card, opacity: 0.94,
              padding: "3px 10px", borderRadius: 999,
            }}>Pour {item.pour}</span>
            <div style={{ position: "absolute", top: 6, right: 6 }}>
              <ActionMenu style={style} actions={actions} />
            </div>
            {hiddenFromRecipient && (
              <span style={{ position: "absolute", bottom: 8, left: 8, fontSize: 11, color: "#fff", background: "rgba(0,0,0,0.45)", padding: "2px 8px", borderRadius: 999, display: "flex", alignItems: "center", gap: 4 }}>
                <Icon name="ti-eye-off" size={12} />Surprise
              </span>
            )}
          </div>

          <div style={{ padding: "12px 14px", display: "flex", flexDirection: "column", gap: 8, flex: 1 }}>
            <div>
              <div style={{ fontWeight: 500, fontSize: 14.5, color: style.ink, lineHeight: 1.3 }}>{item.titre}</div>
              {item.note && <div style={{ fontSize: 12.5, color: style.sub, marginTop: 3 }}>{item.note}</div>}
            </div>

            {item.categorie && (
              <span style={{ fontSize: 11, color: style.sub, alignSelf: "flex-start" }}>#{item.categorie}</span>
            )}

            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontWeight: 500, fontSize: 14, color: style.ink }}>{item.prix ? `${item.prix} €` : ""}</span>
              {item.statut && (
                <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11.5, color: style.sub }}>
                  <Icon name={STATUT_ICON[item.statut]} size={13} />{STATUT_LABEL[item.statut]}
                </span>
              )}
            </div>

            {isReserved && (
              <div style={{ fontSize: 11.5, color: style.pineText, display: "flex", alignItems: "center", gap: 4 }}>
                <Icon name="ti-shopping-cart" size={13} />Réservé par {item.reservePar}
              </div>
            )}

            {item.lien && (
              <a href={item.lien} target="_blank" rel="noopener noreferrer" style={{
                fontSize: 12, color: style.sub, display: "flex", alignItems: "center", gap: 4, textDecoration: "none",
              }}><Icon name="ti-external-link" size={13} />Voir le lien</a>
            )}

            {item.commentaires && item.commentaires.length > 0 && (
              <div style={{ borderTop: `1px solid ${style.line}`, paddingTop: 7, display: "flex", flexDirection: "column", gap: 3 }}>
                {item.commentaires.map((c, idx) => (
                  <div key={idx} style={{ fontSize: 11.5, color: style.sub }}>
                    <span style={{ fontWeight: 500, color: style.ink }}>{c.utilisateur}</span> {c.texte}
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 6, marginTop: "auto", paddingTop: 4 }}>
              <input
                type="text"
                placeholder="Commenter..."
                value={commentDraft}
                onChange={e => setCommentDraft(e.target.value)}
                style={{ ...inputStyle, marginTop: 0, padding: "6px 10px", fontSize: 12, flex: 1 }}
                onKeyDown={(e) => { if (e.key === "Enter") submitComment(); }}
              />
              <button onClick={submitComment} aria-label="Envoyer" style={{
                border: "none", borderRadius: 8, width: 30, background: style.cardMuted, color: style.sub, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
              }}><Icon name="ti-send" size={14} /></button>
            </div>
          </div>
        </div>
      );
    }

    // ---------- COMPOSANT PRINCIPAL ----------
    function GiftList() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [showForm, setShowForm] = useState(false);
      const [filter, setFilter] = useState("Tous");
      const [currentUser, setCurrentUser] = useState(null);
      const [people, setPeople] = useState(["Enzo", "Angélina"]);
      const [addingPerson, setAddingPerson] = useState(false);
      const [newPerson, setNewPerson] = useState("");
      const [lightbox, setLightbox] = useState(null);
      const [codes, setCodes] = useState({});
      const [pendingPerson, setPendingPerson] = useState(null);
      const [codeAction, setCodeAction] = useState("enter");
      const [codeInput, setCodeInput] = useState("");
      const [codeConfirmInput, setCodeConfirmInput] = useState("");
      const [oldCode, setOldCode] = useState("");
      const [newCode, setNewCode] = useState("");
      const [newCodeConfirm, setNewCodeConfirm] = useState("");
      const [codeError, setCodeError] = useState("");
      const [codeSuccess, setCodeSuccess] = useState("");
      const [photoBusy, setPhotoBusy] = useState(false);

      const [listes, setListes] = useState(["Noël", "Anniversaire"]);
      const [listeActive, setListeActive] = useState("Toutes");
      const [addingListe, setAddingListe] = useState(false);
      const [newListe, setNewListe] = useState("");

      const [darkMode, setDarkMode] = useState(false);
      const [showStats, setShowStats] = useState(false);
      const [showFilters, setShowFilters] = useState(false);

      const [recherche, setRecherche] = useState("");
      const [filtreCategorie, setFiltreCategorie] = useState("");
      const [filtreStatut, setFiltreStatut] = useState("");
      const [prixMin, setPrixMin] = useState("");
      const [prixMax, setPrixMax] = useState("");
      const [tri, setTri] = useState("ordre");

      const [form, setForm] = useState({
        titre: "", pour: "", photos: [], lien: "", note: "", visible: true, categorie: "", statut: "idee", prix: ""
      });
      const [editingId, setEditingId] = useState(null);

      // ---- TEMPS RÉEL ----
      useEffect(() => {
        if (!currentUser) { setLoading(false); return; }
        let query = db.collection("ideas");
        if (listeActive !== "Toutes") query = query.where("liste", "==", listeActive);
        const unsubscribe = query.onSnapshot(
          (snapshot) => {
            const data = [];
            snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
            data.sort((a, b) => {
              const orderA = a.order ?? 999999, orderB = b.order ?? 999999;
              if (orderA !== orderB) return orderA - orderB;
              return (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
            });
            setItems(data);
            setLoading(false);
          },
          (err) => { setError("Erreur de chargement : " + err.message); setLoading(false); }
        );
        return () => unsubscribe();
      }, [listeActive, currentUser]);

      useEffect(() => { loadPeople(); loadIdentity(); loadCodes(); loadListes(); }, []);

      function ajouterHistorique(action, details) {
        if (!currentUser) return;
        db.collection("historique").add({
          action, details, utilisateur: currentUser || "Inconnu",
          date: firebase.firestore.FieldValue.serverTimestamp(), liste: listeActive
        }).catch(() => {});
      }

      async function ajouterItem(item) {
        if (!currentUser) return;
        try {
          const maxOrder = items.length > 0 ? Math.max(...items.map(i => i.order || 0)) : 0;
          const ref = db.collection("ideas").doc();
          await ref.set({
            ...item, id: ref.id, order: maxOrder + 1,
            liste: listeActive === "Toutes" ? "Général" : listeActive,
            commentaires: [], createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          ajouterHistorique("ajout", `${item.titre} pour ${item.pour}`);
        } catch (e) { setError("Erreur d'ajout : " + e.message); }
      }

      async function modifierItem(id, data) {
        if (!currentUser) return;
        try {
          await db.collection("ideas").doc(id).update(data);
          ajouterHistorique("modification", `${data.titre || "un cadeau"} modifié`);
        } catch (e) { setError("Erreur de modification : " + e.message); }
      }

      async function supprimerItem(id) {
        if (!currentUser) return;
        try {
          const item = items.find(i => i.id === id);
          await db.collection("ideas").doc(id).delete();
          if (item) ajouterHistorique("suppression", `${item.titre} supprimé`);
        } catch (e) { setError("Erreur de suppression : " + e.message); }
      }

      async function basculerVisibilite(id) {
        if (!currentUser) return;
        const item = items.find(i => i.id === id);
        if (!item) return;
        const updated = { visible: !item.visible };
        try {
          await db.collection("ideas").doc(id).update(updated);
          ajouterHistorique("visibilite", `${item.titre} ${updated.visible ? "visible" : "caché"}`);
        } catch (e) { setError("Erreur de mise à jour : " + e.message); }
      }

      async function moveItem(id, direction) {
        if (!currentUser) return;
        const currentIndex = items.findIndex(i => i.id === id);
        const newIndex = currentIndex + direction;
        if (newIndex < 0 || newIndex >= items.length) return;
        const newItems = [...items];
        [newItems[currentIndex], newItems[newIndex]] = [newItems[newIndex], newItems[currentIndex]];
        try {
          const batch = db.batch();
          newItems.forEach((item, index) => batch.update(db.collection("ideas").doc(item.id), { order: index + 1 }));
          await batch.commit();
          setItems(newItems);
          ajouterHistorique("reorganisation", `Ordre modifié`);
        } catch (e) { setError("Erreur de réorganisation : " + e.message); }
      }

      async function reserverItem(id) {
        if (!currentUser) return;
        const item = items.find(i => i.id === id);
        if (!item) return;
        const isReservedByMe = item.reservePar === currentUser;
        try {
          await db.collection("ideas").doc(id).update({ reservePar: isReservedByMe ? null : currentUser });
          ajouterHistorique("reservation", `${item.titre} ${isReservedByMe ? "dé-reservé" : "réservé par " + currentUser}`);
        } catch (e) { setError("Erreur de réservation : " + e.message); }
      }

      async function ajouterCommentaire(id, texte) {
        if (!currentUser) return;
        const item = items.find(i => i.id === id);
        if (!item) return;
        const commentaires = item.commentaires || [];
        const nouveau = { utilisateur: currentUser || "Inconnu", texte, date: new Date().toISOString() };
        try {
          await db.collection("ideas").doc(id).update({ commentaires: [...commentaires, nouveau] });
          ajouterHistorique("commentaire", `Commentaire sur ${item.titre}`);
        } catch (e) { setError("Erreur d'ajout de commentaire : " + e.message); }
      }

      async function loadListes() {
        try {
          const doc = await db.collection("config").doc("listes").get();
          if (doc.exists && doc.data().values) setListes(doc.data().values);
        } catch (e) {}
      }
      async function saveListes(next) {
        try { await db.collection("config").doc("listes").set({ values: next }); setListes(next); }
        catch (e) { setError("Erreur sauvegarde listes"); }
      }
      function ajouterListe() {
        const name = newListe.trim();
        if (!name || listes.includes(name)) return;
        saveListes([...listes, name]);
        setListeActive(name); setNewListe(""); setAddingListe(false);
      }

      async function loadCodes() {
        try { const doc = await db.collection("config").doc("codes").get(); if (doc.exists) setCodes(doc.data().values || {}); }
        catch (e) {}
      }
      async function saveCodes(next) {
        try { await db.collection("config").doc("codes").set({ values: next }); setCodes(next); }
        catch (e) {}
      }

      function loadIdentity() {
        try { const res = localStorage.getItem("current-user-name"); if (res) setCurrentUser(res); } catch (e) {}
      }
      function persistIdentity(name) {
        setCurrentUser(name);
        try { if (name === null) localStorage.removeItem("current-user-name"); else localStorage.setItem("current-user-name", name); }
        catch (e) {}
      }

      function loadPeople() {
        try {
          const res = localStorage.getItem("gift-people");
          if (res) { const saved = JSON.parse(res); if (Array.isArray(saved) && saved.length) setPeople(saved); }
        } catch (e) {}
      }
      function savePeople(next) {
        setPeople(next);
        try { localStorage.setItem("gift-people", JSON.stringify(next)); } catch (e) { setError("Erreur sauvegarde personnes"); }
      }

      function startPickPerson(name) {
        if (name === currentUser) return;
        setPendingPerson(name); setCodeInput(""); setCodeConfirmInput("");
        setOldCode(""); setNewCode(""); setNewCodeConfirm(""); setCodeError(""); setCodeSuccess("");
        setCodeAction(codes[name] ? "enter" : "create");
      }
      function startChangeCode() {
        setCodeAction("change"); setOldCode(""); setNewCode(""); setNewCodeConfirm(""); setCodeError(""); setCodeSuccess("");
      }
      function cancelCodeEntry() {
        setPendingPerson(null); setCodeAction("enter"); setCodeInput(""); setCodeConfirmInput("");
        setOldCode(""); setNewCode(""); setNewCodeConfirm(""); setCodeError(""); setCodeSuccess("");
      }
      function submitCode(e) {
        e.preventDefault();
        if (codeAction === "change") {
          if (oldCode !== codes[pendingPerson]) { setCodeError("Ancien code incorrect."); setOldCode(""); return; }
          if (!/^\d{4}$/.test(newCode)) { setCodeError("Le nouveau code doit contenir 4 chiffres."); return; }
          if (newCode !== newCodeConfirm) { setCodeError("Les deux nouveaux codes ne correspondent pas."); return; }
          saveCodes({ ...codes, [pendingPerson]: newCode });
          setCodeSuccess("Code modifié avec succès.");
          setTimeout(() => { setCodeAction("enter"); setCodeSuccess(""); setCodeError(""); setOldCode(""); setNewCode(""); setNewCodeConfirm(""); }, 1800);
          return;
        }
        if (codeAction === "create") {
          if (!/^\d{4}$/.test(codeInput)) { setCodeError("4 chiffres requis."); return; }
          if (codeInput !== codeConfirmInput) { setCodeError("Les codes ne correspondent pas."); return; }
          saveCodes({ ...codes, [pendingPerson]: codeInput });
          persistIdentity(pendingPerson); cancelCodeEntry();
        } else {
          if (codeInput === codes[pendingPerson]) { persistIdentity(pendingPerson); cancelCodeEntry(); }
          else { setCodeError("Code incorrect."); setCodeInput(""); }
        }
      }

      function handleAddPerson() {
        const name = newPerson.trim();
        if (!name) return setAddingPerson(false);
        if (!people.includes(name)) savePeople([...people, name]);
        setForm(f => ({ ...f, pour: name })); setNewPerson(""); setAddingPerson(false);
      }

      function handlePhotoPick(file) {
        if (!file) return;
        setPhotoBusy(true);
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 1400;
            let { width, height } = img;
            if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
            else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            let dataUrl = canvas.toDataURL("image/jpeg", 0.88);
            if (dataUrl.length > 4500000) dataUrl = canvas.toDataURL("image/jpeg", 0.6);
            setForm(f => ({ ...f, photos: [...f.photos, dataUrl] }));
            setPhotoBusy(false);
          };
          img.onerror = () => setPhotoBusy(false);
          img.src = reader.result;
        };
        reader.onerror = () => setPhotoBusy(false);
        reader.readAsDataURL(file);
      }
      function removePhoto(index) { setForm(f => ({ ...f, photos: f.photos.filter((_, i) => i !== index) })); }

      function handleSubmit(e) {
        e.preventDefault();
        if (!currentUser || !form.titre.trim() || !form.pour.trim()) return;
        const data = { ...form, titre: form.titre.trim(), pour: form.pour.trim(), creePar: currentUser, prix: form.prix ? form.prix.trim() : "" };
        if (editingId) { modifierItem(editingId, data); setEditingId(null); } else { ajouterItem(data); }
        setForm({ titre: "", pour: "", photos: [], lien: "", note: "", visible: true, categorie: "", statut: "idee", prix: "" });
        setShowForm(false);
      }

      function ouvrirModification(item) {
        setForm({
          titre: item.titre, pour: item.pour, photos: item.photos || (item.photo ? [item.photo] : []),
          lien: item.lien || "", note: item.note || "", visible: item.visible !== false,
          categorie: item.categorie || "", statut: item.statut || "idee", prix: item.prix || ""
        });
        setEditingId(item.id); setShowForm(true);
      }

      function calculerStats() {
        const total = items.length;
        const parPersonne = {}, parCategorie = {}, parStatut = {};
        const surprises = items.filter(i => i.visible === false).length;
        const avecPhoto = items.filter(i => (i.photos && i.photos.length > 0) || i.photo).length;
        let totalPrix = 0, prixParPersonne = {};
        items.forEach(i => {
          parPersonne[i.pour] = (parPersonne[i.pour] || 0) + 1;
          if (i.categorie) parCategorie[i.categorie] = (parCategorie[i.categorie] || 0) + 1;
          if (i.statut) parStatut[i.statut] = (parStatut[i.statut] || 0) + 1;
          if (i.prix) {
            const prix = parseFloat(i.prix.replace(",", "."));
            if (!isNaN(prix)) { totalPrix += prix; prixParPersonne[i.pour] = (prixParPersonne[i.pour] || 0) + prix; }
          }
        });
        return { total, parPersonne, parCategorie, parStatut, surprises, avecPhoto, totalPrix, prixParPersonne };
      }

      const itemsFiltres = useMemo(() => {
        if (!currentUser) return [];
        let result = items;
        if (filter !== "Tous") result = result.filter(i => i.pour === filter);
        if (recherche.trim()) {
          const search = recherche.trim().toLowerCase();
          result = result.filter(i => i.titre.toLowerCase().includes(search) || (i.note && i.note.toLowerCase().includes(search)) || (i.categorie && i.categorie.toLowerCase().includes(search)));
        }
        if (filtreCategorie) result = result.filter(i => i.categorie === filtreCategorie);
        if (filtreStatut) result = result.filter(i => i.statut === filtreStatut);
        if (prixMin) { const min = parseFloat(prixMin.replace(",", ".")); if (!isNaN(min)) result = result.filter(i => { if (!i.prix) return false; const p = parseFloat(i.prix.replace(",", ".")); return !isNaN(p) && p >= min; }); }
        if (prixMax) { const max = parseFloat(prixMax.replace(",", ".")); if (!isNaN(max)) result = result.filter(i => { if (!i.prix) return false; const p = parseFloat(i.prix.replace(",", ".")); return !isNaN(p) && p <= max; }); }
        let triEffectif = tri;
        if (listeActive === "Toutes" && tri === "ordre") triEffectif = "date-recent";
        result = [...result];
        switch (triEffectif) {
          case "prix-croissant": result.sort((a, b) => (parseFloat((a.prix || "0").replace(",", ".")) || 0) - (parseFloat((b.prix || "0").replace(",", ".")) || 0)); break;
          case "prix-decroissant": result.sort((a, b) => (parseFloat((b.prix || "0").replace(",", ".")) || 0) - (parseFloat((a.prix || "0").replace(",", ".")) || 0)); break;
          case "date": result.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)); break;
          case "date-recent": result.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); break;
          case "alpha": result.sort((a, b) => a.titre.localeCompare(b.titre)); break;
          default: result.sort((a, b) => (a.order || 0) - (b.order || 0));
        }
        return result;
      }, [items, filter, recherche, filtreCategorie, filtreStatut, prixMin, prixMax, tri, listeActive, currentUser]);

      const categoriesDispo = useMemo(() => {
        const cats = new Set();
        items.forEach(i => { if (i.categorie) cats.add(i.categorie); });
        return Array.from(cats);
      }, [items]);

      const style = darkMode ? DARK : LIGHT;

      const inputStyle = {
        width: "100%", boxSizing: "border-box", border: `1px solid ${style.line}`, borderRadius: 8,
        padding: "9px 11px", fontSize: 14, marginTop: 4, fontFamily: "inherit", color: style.ink,
        background: darkMode ? "#232019" : "#FEFDFB", outline: "none",
      };
      const pageFont = "'Segoe UI', system-ui, -apple-system, sans-serif";

      // ---- ÉCRAN DE SÉLECTION ----
      if (!currentUser) {
        return (
          <div style={{ minHeight: "100vh", background: style.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: pageFont }}>
            <div style={{ background: style.card, borderRadius: 20, padding: "40px 32px", maxWidth: 420, width: "100%", textAlign: "center", border: `1px solid ${style.line}`, boxShadow: "0 8px 30px rgba(0,0,0,0.06)" }}>
              <Icon name="ti-gift" size={38} style={{ color: style.rose }} />
              <h1 style={{ fontFamily: "Georgia, serif", fontWeight: 400, fontSize: 26, color: style.ink, margin: "10px 0 6px" }}>Liste Cadeaux</h1>
              <p style={{ color: style.sub, fontSize: 14, marginBottom: 24 }}>Choisis qui tu es pour accéder à la liste.</p>

              <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
                {people.map(p => {
                  const theme = themeFor(style, p);
                  return (
                    <button key={p} onClick={() => startPickPerson(p)} style={{
                      border: `1px solid ${theme.main}`, borderRadius: 12, padding: "13px 20px", fontSize: 16, fontWeight: 500,
                      cursor: "pointer", background: "transparent", color: theme.main, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                    }}
                      onMouseEnter={(e) => { e.currentTarget.style.background = theme.main; e.currentTarget.style.color = "#fff"; }}
                      onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = theme.main; }}
                    >{p}</button>
                  );
                })}
                <button onClick={() => setAddingPerson(true)} style={{
                  border: `1px dashed ${style.line}`, borderRadius: 12, padding: "13px 20px", fontSize: 14, fontWeight: 500,
                  cursor: "pointer", background: "transparent", color: style.sub, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                }}><Icon name="ti-user-plus" size={16} />Nouvelle personne</button>
              </div>

              {addingPerson && (
                <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                  <input autoFocus value={newPerson} onChange={e => setNewPerson(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") handleAddPerson(); }}
                    placeholder="Prénom" style={{ ...inputStyle, marginTop: 0, flex: 1 }} />
                  <button onClick={handleAddPerson} style={{ border: "none", borderRadius: 8, padding: "0 16px", background: style.ink, color: style.bg, cursor: "pointer", fontSize: 14, fontWeight: 500 }}>Ajouter</button>
                  <button onClick={() => { setAddingPerson(false); setNewPerson(""); }} style={{ border: "none", borderRadius: 8, padding: "0 12px", background: "transparent", color: style.sub, cursor: "pointer", fontSize: 14 }}>Annuler</button>
                </div>
              )}

              {pendingPerson && (
                <div style={{ marginTop: 18, padding: 18, background: style.cardMuted, borderRadius: 12, border: `1px solid ${style.line}`, textAlign: "left" }}>
                  <div style={{ fontSize: 14, fontWeight: 500, color: style.ink, textAlign: "center" }}>
                    {codeAction === "create" && `Crée un code à 4 chiffres pour ${pendingPerson}`}
                    {codeAction === "enter" && `Entre le code de ${pendingPerson}`}
                    {codeAction === "change" && `Changer le code de ${pendingPerson}`}
                  </div>
                  {codeAction === "create" && <div style={{ fontSize: 12, color: style.sub, marginTop: 4, textAlign: "center" }}>Ce code protège tes surprises.</div>}

                  {codeAction === "enter" && (
                    <>
                      <div style={{ display: "flex", justifyContent: "center", marginTop: 12 }}>
                        <input autoFocus type="password" inputMode="numeric" maxLength={4} value={codeInput}
                          onChange={(e) => setCodeInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
                          onKeyDown={e => e.key === "Enter" && submitCode(e)}
                          placeholder="0000" style={{ ...inputStyle, marginTop: 0, width: 90, textAlign: "center", letterSpacing: 6, fontSize: 18 }} />
                      </div>
                      <div style={{ marginTop: 10, textAlign: "center" }}>
                        <button type="button" onClick={startChangeCode} style={{ background: "transparent", border: "none", color: style.sub, fontSize: 12, cursor: "pointer", textDecoration: "underline" }}>Changer mon code</button>
                      </div>
                    </>
                  )}

                  {codeAction === "create" && (
                    <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 12 }}>
                      <input autoFocus type="password" inputMode="numeric" maxLength={4} value={codeInput}
                        onChange={(e) => setCodeInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
                        placeholder="Code" style={{ ...inputStyle, marginTop: 0, width: 84, textAlign: "center", letterSpacing: 4, fontSize: 16 }} />
                      <input type="password" inputMode="numeric" maxLength={4} value={codeConfirmInput}
                        onChange={(e) => setCodeConfirmInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
                        placeholder="Confirme" style={{ ...inputStyle, marginTop: 0, width: 84, textAlign: "center", letterSpacing: 4, fontSize: 16 }} />
                    </div>
                  )}

                  {codeAction === "change" && (
                    <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
                      <input autoFocus type="password" inputMode="numeric" maxLength={4} value={oldCode}
                        onChange={(e) => setOldCode(e.target.value.replace(/\D/g, "").slice(0, 4))}
                        placeholder="Ancien code" style={{ ...inputStyle, marginTop: 0, textAlign: "center", letterSpacing: 4, fontSize: 16 }} />
                      <input type="password" inputMode="numeric" maxLength={4} value={newCode}
                        onChange={(e) => setNewCode(e.target.value.replace(/\D/g, "").slice(0, 4))}
                        placeholder="Nouveau code" style={{ ...inputStyle, marginTop: 0, textAlign: "center", letterSpacing: 4, fontSize: 16 }} />
                      <input type="password" inputMode="numeric" maxLength={4} value={newCodeConfirm}
                        onChange={(e) => setNewCodeConfirm(e.target.value.replace(/\D/g, "").slice(0, 4))}
                        placeholder="Confirme nouveau code" style={{ ...inputStyle, marginTop: 0, textAlign: "center", letterSpacing: 4, fontSize: 16 }} />
                    </div>
                  )}

                  {codeError && <div style={{ fontSize: 12, color: style.rose, marginTop: 8, textAlign: "center" }}>{codeError}</div>}
                  {codeSuccess && <div style={{ fontSize: 12, color: style.pine, marginTop: 8, textAlign: "center" }}>{codeSuccess}</div>}

                  <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 14 }}>
                    <button onClick={cancelCodeEntry} style={{ background: "transparent", border: "none", color: style.sub, fontSize: 13, cursor: "pointer" }}>Annuler</button>
                    <button onClick={submitCode} style={{ background: style.ink, color: style.bg, border: "none", borderRadius: 999, padding: "7px 20px", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>
                      {codeAction === "create" && "Créer"}{codeAction === "enter" && "Valider"}{codeAction === "change" && "Changer"}
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ---- RENDU PRINCIPAL ----
      return (
        <div style={{ minHeight: "100vh", background: style.bg, color: style.ink, fontFamily: pageFont }}>
          <div style={{ maxWidth: 860, margin: "0 auto", padding: "28px 20px 60px" }}>

            <header style={{ marginBottom: 18 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 7, color: style.rose }}>
                  <Icon name="ti-gift" size={18} />
                  <span style={{ fontSize: 12.5, color: style.sub, fontWeight: 500 }}>Liste partagée</span>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <span style={{ fontSize: 13, color: style.sub }}>{currentUser}</span>
                  <button onClick={() => persistIdentity(null)} style={{ background: "transparent", border: `1px solid ${style.line}`, borderRadius: 999, padding: "5px 12px", fontSize: 12, cursor: "pointer", color: style.sub }}>Changer</button>
                  <button aria-label="Basculer le mode sombre" onClick={() => setDarkMode(!darkMode)} style={{ background: "transparent", border: `1px solid ${style.line}`, borderRadius: 999, width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: style.ink }}>
                    <Icon name={darkMode ? "ti-sun" : "ti-moon"} size={15} />
                  </button>
                </div>
              </div>
              <h1 style={{ fontFamily: "Georgia, serif", fontWeight: 400, fontSize: 30, color: style.ink, margin: "10px 0 4px" }}>Idées cadeaux</h1>
              <p style={{ color: style.sub, fontSize: 13.5, margin: 0 }}>Les surprises restent cachées à leurs destinataires.</p>
            </header>

            {/* LISTES */}
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16, alignItems: "center" }}>
              <Chip active={listeActive === "Toutes"} onClick={() => setListeActive("Toutes")} style={style} small>Toutes</Chip>
              {listes.map(l => <Chip key={l} active={listeActive === l} onClick={() => setListeActive(l)} style={style} small>{l}</Chip>)}
              {addingListe ? (
                <div style={{ display: "flex", gap: 4 }}>
                  <input autoFocus value={newListe} onChange={e => setNewListe(e.target.value)} onKeyDown={e => e.key === "Enter" && ajouterListe()}
                    placeholder="Nom" style={{ ...inputStyle, marginTop: 0, width: 100, padding: "5px 9px", fontSize: 12 }} />
                  <button onClick={ajouterListe} style={{ border: "none", borderRadius: 8, padding: "0 10px", background: style.ink, color: style.bg, cursor: "pointer", fontSize: 12 }}>OK</button>
                </div>
              ) : (
                <button onClick={() => setAddingListe(true)} aria-label="Ajouter une liste" style={{ border: `1px dashed ${style.line}`, borderRadius: 999, width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", background: "transparent", color: style.sub }}>
                  <Icon name="ti-plus" size={13} />
                </button>
              )}
            </div>

            {error && (
              <div style={{ background: style.roseSoft, color: style.roseText, padding: "10px 14px", borderRadius: 10, marginBottom: 16, fontSize: 13, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                {error}
                <button onClick={() => setError(null)} aria-label="Fermer" style={{ background: "transparent", border: "none", color: style.roseText, cursor: "pointer" }}><Icon name="ti-x" size={14} /></button>
              </div>
            )}

            {/* ACTIONS */}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18, alignItems: "center" }}>
              <button onClick={() => { setEditingId(null); setForm({ titre: "", pour: "", photos: [], lien: "", note: "", visible: true, categorie: "", statut: "idee", prix: "" }); setShowForm(true); }}
                style={{ background: style.rose, color: "#fff", border: "none", borderRadius: 999, padding: "9px 17px", fontSize: 13, fontWeight: 500, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
                <Icon name="ti-plus" size={15} />Ajouter
              </button>
              <Chip active={showStats} onClick={() => setShowStats(!showStats)} style={style}><Icon name="ti-chart-bar" size={14} />Stats</Chip>
              <Chip active={showFilters} onClick={() => setShowFilters(!showFilters)} style={style}><Icon name="ti-filter" size={14} />Filtrer</Chip>

              <div style={{ flex: 1 }} />

              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                <Chip active={filter === "Tous"} onClick={() => setFilter("Tous")} style={style} small>Tous</Chip>
                {people.map(p => <Chip key={p} active={filter === p} onClick={() => setFilter(p)} style={style} small>{p}</Chip>)}
              </div>
            </div>

            {/* FILTRES */}
            {showFilters && (
              <div style={{ background: style.card, border: `1px solid ${style.line}`, borderRadius: 12, padding: "14px 16px", marginBottom: 18, display: "grid", gap: 10 }}>
                <input type="text" placeholder="Rechercher un cadeau, une catégorie..." value={recherche} onChange={e => setRecherche(e.target.value)} style={inputStyle} />
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <select value={filtreCategorie} onChange={e => setFiltreCategorie(e.target.value)} style={{ ...inputStyle, marginTop: 0, width: "auto" }}>
                    <option value="">Toutes catégories</option>
                    {categoriesDispo.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <select value={filtreStatut} onChange={e => setFiltreStatut(e.target.value)} style={{ ...inputStyle, marginTop: 0, width: "auto" }}>
                    <option value="">Tous statuts</option>
                    <option value="idee">Idée</option><option value="commande">Commandé</option><option value="offert">Offert</option><option value="abandonne">Abandonné</option>
                  </select>
                  <input type="number" placeholder="Prix min" value={prixMin} onChange={e => setPrixMin(e.target.value)} style={{ ...inputStyle, marginTop: 0, width: 90 }} />
                  <input type="number" placeholder="Prix max" value={prixMax} onChange={e => setPrixMax(e.target.value)} style={{ ...inputStyle, marginTop: 0, width: 90 }} />
                  <select value={tri} onChange={e => setTri(e.target.value)} style={{ ...inputStyle, marginTop: 0, width: "auto" }}>
                    <option value="ordre">Ordre</option><option value="prix-croissant">Prix croissant</option><option value="prix-decroissant">Prix décroissant</option>
                    <option value="date">Plus ancien</option><option value="date-recent">Plus récent</option><option value="alpha">Alphabétique</option>
                  </select>
                  <button onClick={() => { setRecherche(""); setFiltreCategorie(""); setFiltreStatut(""); setPrixMin(""); setPrixMax(""); setTri("ordre"); }}
                    style={{ background: "transparent", border: `1px solid ${style.line}`, borderRadius: 8, padding: "7px 12px", fontSize: 12, cursor: "pointer", color: style.sub }}>Réinitialiser</button>
                </div>
              </div>
            )}

            {/* STATS */}
            {showStats && (() => {
              const stats = calculerStats();
              const cards = [
                { label: "Total", value: stats.total },
                { label: "Surprises", value: stats.surprises },
                { label: "Avec photo", value: stats.avecPhoto },
                { label: "Budget total", value: stats.totalPrix.toFixed(2) + " €" },
              ];
              return (
                <div style={{ background: style.card, border: `1px solid ${style.line}`, borderRadius: 14, padding: 16, marginBottom: 18 }}>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 10 }}>
                    {cards.map(c => (
                      <div key={c.label} style={{ background: style.cardMuted, padding: 12, borderRadius: 10, textAlign: "center" }}>
                        <div style={{ fontSize: 20, fontWeight: 500 }}>{c.value}</div>
                        <div style={{ fontSize: 11.5, color: style.sub, marginTop: 2 }}>{c.label}</div>
                      </div>
                    ))}
                    {Object.entries(stats.parPersonne).length > 0 && (
                      <div style={{ background: style.cardMuted, padding: 12, borderRadius: 10, textAlign: "center" }}>
                        <div style={{ fontSize: 13, fontWeight: 500 }}>{Object.entries(stats.parPersonne).map(([k, v]) => `${k}: ${v}`).join(" · ")}</div>
                        <div style={{ fontSize: 11.5, color: style.sub, marginTop: 2 }}>Par personne (nb)</div>
                      </div>
                    )}
                    {Object.keys(stats.prixParPersonne).length > 0 && (
                      <div style={{ background: style.cardMuted, padding: 12, borderRadius: 10, textAlign: "center" }}>
                        <div style={{ fontSize: 13, fontWeight: 500 }}>{Object.entries(stats.prixParPersonne).map(([k, v]) => `${k}: ${v.toFixed(2)}€`).join(" · ")}</div>
                        <div style={{ fontSize: 11.5, color: style.sub, marginTop: 2 }}>Budget par personne</div>
                      </div>
                    )}
                    {Object.keys(stats.parCategorie).length > 0 && (
                      <div style={{ background: style.cardMuted, padding: 12, borderRadius: 10, textAlign: "center" }}>
                        <div style={{ fontSize: 13, fontWeight: 500 }}>{Object.entries(stats.parCategorie).map(([k, v]) => `${k}: ${v}`).join(" · ")}</div>
                        <div style={{ fontSize: 11.5, color: style.sub, marginTop: 2 }}>Catégories</div>
                      </div>
                    )}
                    {Object.keys(stats.parStatut).length > 0 && (
                      <div style={{ background: style.cardMuted, padding: 12, borderRadius: 10, textAlign: "center" }}>
                        <div style={{ fontSize: 13, fontWeight: 500 }}>{Object.entries(stats.parStatut).map(([k, v]) => `${STATUT_LABEL[k] || k}: ${v}`).join(" · ")}</div>
                        <div style={{ fontSize: 11.5, color: style.sub, marginTop: 2 }}>Statuts</div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })()}

            {/* FORMULAIRE */}
            {showForm && (
              <form onSubmit={handleSubmit} style={{ background: style.card, border: `1px solid ${style.line}`, borderRadius: 14, padding: 20, marginBottom: 22, display: "grid", gap: 12 }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Nom *</label>
                    <input required value={form.titre} onChange={e => setForm({ ...form, titre: e.target.value })} placeholder="Ex. Enceinte" style={inputStyle} />
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Pour *</label>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
                      {people.map(p => <Chip key={p} active={form.pour === p} onClick={() => setForm({ ...form, pour: p })} style={style} small>{p}</Chip>)}
                      {addingPerson ? (
                        <div style={{ display: "flex", gap: 4 }}>
                          <input autoFocus value={newPerson} onChange={e => setNewPerson(e.target.value)} onKeyDown={e => e.key === "Enter" && handleAddPerson()}
                            placeholder="Prénom" style={{ ...inputStyle, marginTop: 0, width: 100, padding: "5px 9px" }} />
                          <button type="button" onClick={handleAddPerson} style={{ border: "none", borderRadius: 8, padding: "0 10px", background: style.ink, color: style.bg, cursor: "pointer" }}>OK</button>
                        </div>
                      ) : (
                        <button type="button" onClick={() => setAddingPerson(true)} aria-label="Ajouter une personne" style={{ border: `1px dashed ${style.line}`, borderRadius: 999, width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", background: "transparent", color: style.sub, cursor: "pointer" }}><Icon name="ti-plus" size={13} /></button>
                      )}
                    </div>
                  </div>
                </div>

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Prix (€)</label>
                    <input type="text" inputMode="decimal" value={form.prix} onChange={e => setForm({ ...form, prix: e.target.value })} placeholder="49.99" style={inputStyle} />
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Catégorie</label>
                    <input value={form.categorie} onChange={e => setForm({ ...form, categorie: e.target.value })} placeholder="Tech, Mode..." style={inputStyle} />
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Statut</label>
                    <select value={form.statut} onChange={e => setForm({ ...form, statut: e.target.value })} style={{ ...inputStyle, marginTop: 4 }}>
                      <option value="idee">Idée</option><option value="commande">Commandé</option><option value="offert">Offert</option><option value="abandonne">Abandonné</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label style={{ fontSize: 12, color: style.sub }}>Photos</label>
                  <input type="file" accept="image/*" onChange={e => handlePhotoPick(e.target.files[0])} style={{ ...inputStyle, padding: "7px 9px" }} />
                  {photoBusy && <div style={{ fontSize: 11, color: style.sub }}>Traitement...</div>}
                  {form.photos.length > 0 && (
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
                      {form.photos.map((p, idx) => (
                        <div key={idx} style={{ position: "relative" }}>
                          <img src={p} style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 8, border: `1px solid ${style.line}` }} />
                          <button type="button" onClick={() => removePhoto(idx)} aria-label="Retirer la photo" style={{ position: "absolute", top: -6, right: -6, background: style.rose, color: "#fff", border: "none", borderRadius: 999, width: 18, height: 18, fontSize: 12, cursor: "pointer", lineHeight: "18px" }}>×</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div>
                  <label style={{ fontSize: 12, color: style.sub }}>Lien</label>
                  <input value={form.lien} onChange={e => setForm({ ...form, lien: e.target.value })} placeholder="https://..." style={inputStyle} />
                </div>

                <div>
                  <label style={{ fontSize: 12, color: style.sub }}>Note</label>
                  <textarea value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} rows={2} style={{ ...inputStyle, resize: "vertical" }} />
                </div>

                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer" }}>
                  <input type="checkbox" checked={!form.visible} onChange={e => setForm({ ...form, visible: !e.target.checked })} />
                  Garder la surprise (caché à {form.pour || "la personne"})
                </label>

                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                  <button type="button" onClick={() => { setShowForm(false); setEditingId(null); }} style={{ background: "transparent", border: "none", color: style.sub, fontSize: 13, cursor: "pointer" }}>Annuler</button>
                  <button type="submit" style={{ background: style.rose, color: "#fff", border: "none", borderRadius: 999, padding: "8px 18px", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>{editingId ? "Modifier" : "Ajouter"}</button>
                </div>
              </form>
            )}

            {/* LISTE */}
            {loading ? (
              <div style={{ color: style.sub, fontSize: 13 }}>Chargement...</div>
            ) : itemsFiltres.length === 0 ? (
              <div style={{ textAlign: "center", padding: "60px 20px", color: style.sub, border: `1px dashed ${style.line}`, borderRadius: 14 }}>
                <Icon name="ti-gift" size={34} style={{ color: style.muted }} />
                <div style={{ fontSize: 14, marginTop: 10 }}>{items.length === 0 ? "Aucun cadeau. Ajoute la première idée !" : "Aucun résultat, ajuste tes filtres."}</div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(230px, 1fr))", gap: 16 }}>
                {itemsFiltres.map(item => (
                  <GiftTag key={item.id} item={item} onDelete={supprimerItem} onToggleVisible={basculerVisibilite}
                    onOpenPhoto={(src, titre) => setLightbox({ src, titre })} currentUser={currentUser} onEdit={ouvrirModification}
                    onMove={moveItem} onReserver={reserverItem} onAddComment={ajouterCommentaire} inputStyle={inputStyle} style={style} />
                ))}
              </div>
            )}
          </div>

          {lightbox && (
            <div onClick={() => setLightbox(null)} style={{ position: "fixed", inset: 0, background: style.overlay, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20, cursor: "zoom-out" }}>
              <img src={lightbox.src} alt={lightbox.titre} style={{ maxWidth: "100%", maxHeight: "80vh", borderRadius: 10 }} />
              <div style={{ color: "#fff", marginTop: 14, fontSize: 14 }}>{lightbox.titre}</div>
              <button onClick={() => setLightbox(null)} aria-label="Fermer" style={{ position: "absolute", top: 18, right: 18, background: "rgba(255,255,255,0.12)", border: "none", color: "#fff", borderRadius: 999, width: 34, height: 34, fontSize: 18, cursor: "pointer" }}>×</button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GiftList />);
  </script>
</body>
</html>
