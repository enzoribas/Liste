<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liste Cadeaux</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCJPpjyj3HAIoQhVzTW136z9RfdVS7uCA0",
      authDomain: "liste-cadeaux-eb4f4.firebaseapp.com",
      projectId: "liste-cadeaux-eb4f4",
      storageBucket: "liste-cadeaux-eb4f4.firebasestorage.app",
      messagingSenderId: "709606688470",
      appId: "1:709606688470:web:51aee7565f4d44ced3eb77",
      measurementId: "G-2V619QLTQP"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const PALETTE = {
      bg: "#FBF6EF",
      card: "#FFFFFF",
      ink: "#2E2A25",
      sub: "#8A8072",
      rose: "#C6584F",
      roseSoft: "#F4E1DD",
      pine: "#3F5B4E",
      pineSoft: "#E1EAE3",
      gold: "#C79A3E",
      line: "#E6DCCB",
    };

    const THEMES = [PALETTE.rose, PALETTE.pine, PALETTE.gold];

    function themeFor(name) {
      if (!name) return { main: PALETTE.sub, soft: "#EFEAE1" };
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const c = THEMES[Math.abs(hash) % THEMES.length];
      const softMap = { [PALETTE.rose]: PALETTE.roseSoft, [PALETTE.pine]: PALETTE.pineSoft, [PALETTE.gold]: "#F3E9D2" };
      return { main: c, soft: softMap[c] };
    }

    // ---------- GIFT TAG (icônes réduites) ----------
    function GiftTag({ item, onDelete, onToggleVisible, onOpenPhoto, currentUser, onEdit, onMove, onReserver, onAddComment, inputStyle }) {
      const theme = themeFor(item.pour);
      const isForMe = item.pour === currentUser;
      const hiddenFromRecipient = item.visible === false;
      const isReserved = item.reservePar && item.reservePar !== currentUser;

      if (hiddenFromRecipient && isForMe) {
        return (
          <div style={{
            background: PALETTE.card,
            borderRadius: 14,
            border: `1px solid ${PALETTE.line}`,
            padding: 18,
            boxShadow: "0 1px 2px rgba(46,42,37,0.04)",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 8,
            minHeight: 120,
          }}>
            <div style={{ fontSize: 36 }}>🎁</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: PALETTE.ink, fontFamily: "Georgia, serif" }}>
              Une idée pour toi
            </div>
            <div style={{ fontSize: 11, color: PALETTE.sub, fontStyle: "italic" }}>
              {item.creePar || "Quelqu'un"} a pensé à toi 🤫
            </div>
            <button onClick={() => onDelete(item.id)} style={{
              background: "transparent",
              border: "none",
              color: PALETTE.sub,
              cursor: "pointer",
              padding: 4,
              fontSize: 14,
            }}>🗑️</button>
          </div>
        );
      }

      const photos = item.photos && item.photos.length > 0 ? item.photos : (item.photo ? [item.photo] : []);

      return (
        <div style={{
          background: PALETTE.card,
          borderRadius: 14,
          border: `1px solid ${PALETTE.line}`,
          padding: 18,
          position: "relative",
          boxShadow: "0 1px 2px rgba(46,42,37,0.04)",
          display: "flex",
          flexDirection: "column",
          gap: 10,
        }}>
          <div aria-hidden="true" style={{
            position: "absolute",
            top: -8,
            left: 22,
            width: 16,
            height: 16,
            borderRadius: "50%",
            background: PALETTE.bg,
            border: `1px solid ${PALETTE.line}`,
          }} />

          {photos.length > 0 ? (
            <div style={{ display: "flex", gap: 4, overflowX: "auto", paddingBottom: 4 }}>
              {photos.map((p, idx) => (
                <button key={idx} onClick={() => onOpenPhoto(p, item.titre)} style={{
                  flexShrink: 0,
                  width: 100,
                  height: 100,
                  borderRadius: 10,
                  overflow: "hidden",
                  background: theme.soft,
                  border: "none",
                  padding: 0,
                  cursor: "zoom-in",
                }}>
                  <img src={p} alt={item.titre} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }}
                    onError={(e) => { e.target.style.display = "none"; }} />
                </button>
              ))}
            </div>
          ) : (
            <div style={{
              width: "100%",
              height: 90,
              borderRadius: 10,
              background: theme.soft,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              color: theme.main,
              fontSize: 40,
            }}>🎁</div>
          )}

          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: "Georgia, serif", fontSize: 17, color: PALETTE.ink, lineHeight: 1.25, wordBreak: "break-word" }}>
                {item.titre}
              </div>
              {item.note && <div style={{ fontSize: 13, color: PALETTE.sub, marginTop: 4 }}>{item.note}</div>}
              {item.prix && (
                <div style={{ fontSize: 15, fontWeight: 600, color: PALETTE.gold, marginTop: 4 }}>
                  💰 {item.prix} €
                </div>
              )}
              {isReserved && (
                <div style={{ fontSize: 12, color: PALETTE.rose, fontWeight: 600, marginTop: 4 }}>
                  🛒 Réservé par {item.reservePar}
                </div>
              )}
              <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
                {item.categorie && (
                  <span style={{ fontSize: 10, background: PALETTE.gold + "33", color: PALETTE.gold, padding: "2px 8px", borderRadius: 999 }}>
                    #{item.categorie}
                  </span>
                )}
                {item.statut && (
                  <span style={{ fontSize: 10, background: PALETTE.pineSoft, color: PALETTE.pine, padding: "2px 8px", borderRadius: 999 }}>
                    {item.statut === "idee" && "💡 Idée"}
                    {item.statut === "commande" && "🛒 Commandé"}
                    {item.statut === "offert" && "🎁 Offert"}
                    {item.statut === "abandonne" && "❌ Abandonné"}
                  </span>
                )}
              </div>
              {item.commentaires && item.commentaires.length > 0 && (
                <div style={{ marginTop: 8, borderTop: `1px solid ${PALETTE.line}`, paddingTop: 6 }}>
                  {item.commentaires.map((c, idx) => (
                    <div key={idx} style={{ fontSize: 11, color: PALETTE.sub, fontStyle: "italic" }}>
                      💬 {c.utilisateur}: {c.texte}
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Boutons icônes réduits */}
            <div style={{ 
              display: "flex", 
              gap: 1, 
              flexShrink: 0, 
              flexWrap: "wrap", 
              justifyContent: "flex-end",
              maxWidth: "60%",
            }}>
              {!isForMe && !isReserved && (
                <button onClick={() => onReserver(item.id)} style={{
                  background: "transparent",
                  border: "none",
                  color: PALETTE.pine,
                  cursor: "pointer",
                  padding: 2,
                  fontSize: 13,
                  fontWeight: 600,
                }}>🛒</button>
              )}
              {isReserved && item.reservePar === currentUser && (
                <button onClick={() => onReserver(item.id)} style={{
                  background: "transparent",
                  border: "none",
                  color: PALETTE.rose,
                  cursor: "pointer",
                  padding: 2,
                  fontSize: 13,
                  fontWeight: 600,
                }}>❌</button>
              )}
              {!isForMe && (
                <button onClick={() => onToggleVisible(item.id)} style={{
                  background: "transparent",
                  border: "none",
                  color: PALETTE.sub,
                  cursor: "pointer",
                  padding: 2,
                  fontSize: 13,
                }}>
                  {hiddenFromRecipient ? "🙈" : "👁️"}
                </button>
              )}
              <button onClick={() => onEdit(item)} style={{
                background: "transparent",
                border: "none",
                color: PALETTE.sub,
                cursor: "pointer",
                padding: 2,
                fontSize: 13,
              }}>✏️</button>
              <button onClick={() => onMove(item.id, -1)} style={{
                background: "transparent",
                border: "none",
                color: PALETTE.sub,
                cursor: "pointer",
                padding: 2,
                fontSize: 13,
              }}>⬆️</button>
              <button onClick={() => onMove(item.id, 1)} style={{
                background: "transparent",
                border: "none",
                color: PALETTE.sub,
                cursor: "pointer",
                padding: 2,
                fontSize: 13,
              }}>⬇️</button>
              <button onClick={() => onDelete(item.id)} style={{
                background: "transparent",
                border: "none",
                color: PALETTE.sub,
                cursor: "pointer",
                padding: 2,
                fontSize: 13,
              }}>🗑️</button>
            </div>
          </div>

          <div style={{ display: "flex", gap: 4, marginTop: 4 }}>
            <input
              type="text"
              placeholder="Ajouter un commentaire..."
              style={{ ...inputStyle, marginTop: 0, padding: "6px 8px", fontSize: 12 }}
              onKeyDown={(e) => {
                if (e.key === "Enter" && e.target.value.trim()) {
                  onAddComment(item.id, e.target.value.trim());
                  e.target.value = "";
                }
              }}
            />
            <button
              onClick={(e) => {
                const input = e.target.previousSibling;
                if (input && input.value.trim()) {
                  onAddComment(item.id, input.value.trim());
                  input.value = "";
                }
              }}
              style={{
                border: "none",
                borderRadius: 8,
                padding: "4px 10px",
                background: PALETTE.ink,
                color: "#fff",
                cursor: "pointer",
                fontSize: 12,
              }}
            >💬</button>
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 2 }}>
            <span style={{
              fontSize: 11,
              letterSpacing: 0.4,
              textTransform: "uppercase",
              color: theme.main,
              background: theme.soft,
              padding: "3px 9px",
              borderRadius: 999,
              fontWeight: 600,
            }}>Pour {item.pour}</span>
            {hiddenFromRecipient && !isForMe && (
              <span style={{ fontSize: 11, color: PALETTE.rose, fontStyle: "italic" }}>🎁 Surprise</span>
            )}
            {item.lien && (
              <a href={item.lien} target="_blank" rel="noopener noreferrer" style={{
                fontSize: 12,
                color: PALETTE.ink,
                display: "flex",
                alignItems: "center",
                gap: 4,
                textDecoration: "none",
                borderBottom: `1px solid ${PALETTE.line}`,
              }}>🔗 Voir le lien</a>
            )}
          </div>
        </div>
      );
    }

    // ---------- COMPOSANT PRINCIPAL ----------
    function GiftList() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [showForm, setShowForm] = useState(false);
      const [filter, setFilter] = useState("Tous");
      const [currentUser, setCurrentUser] = useState(null);
      const [identityLoaded, setIdentityLoaded] = useState(false);
      const [identityWarning, setIdentityWarning] = useState(false);
      const [people, setPeople] = useState(["Enzo", "Angélina"]);
      const [addingPerson, setAddingPerson] = useState(false);
      const [newPerson, setNewPerson] = useState("");
      const [lightbox, setLightbox] = useState(null);
      const [codes, setCodes] = useState({});
      const [pendingPerson, setPendingPerson] = useState(null);
      const [codeMode, setCodeMode] = useState(null);
      const [codeInput, setCodeInput] = useState("");
      const [codeConfirmInput, setCodeConfirmInput] = useState("");
      const [codeError, setCodeError] = useState("");
      const [photoBusy, setPhotoBusy] = useState(false);

      const [listes, setListes] = useState(["Noël", "Anniversaire"]);
      const [listeActive, setListeActive] = useState("Toutes");
      const [addingListe, setAddingListe] = useState(false);
      const [newListe, setNewListe] = useState("");

      const [darkMode, setDarkMode] = useState(false);
      const [showStats, setShowStats] = useState(false);

      const [recherche, setRecherche] = useState("");
      const [filtreCategorie, setFiltreCategorie] = useState("");
      const [filtreStatut, setFiltreStatut] = useState("");
      const [prixMin, setPrixMin] = useState("");
      const [prixMax, setPrixMax] = useState("");
      const [tri, setTri] = useState("ordre");

      const [form, setForm] = useState({
        titre: "",
        pour: "",
        photos: [],
        lien: "",
        note: "",
        visible: true,
        categorie: "",
        statut: "idee",
        prix: ""
      });
      const [editingId, setEditingId] = useState(null);

      // ---- TEMPS RÉEL (avec "Toutes") ----
      useEffect(() => {
        let query = db.collection("ideas");
        if (listeActive !== "Toutes") {
          query = query.where("liste", "==", listeActive);
        }

        const unsubscribe = query.onSnapshot(
          (snapshot) => {
            const data = [];
            snapshot.forEach(doc => {
              data.push({ id: doc.id, ...doc.data() });
            });
            data.sort((a, b) => {
              const orderA = a.order ?? 999999;
              const orderB = b.order ?? 999999;
              if (orderA !== orderB) return orderA - orderB;
              return (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
            });
            setItems(data);
            setLoading(false);
          },
          (err) => {
            console.error("Erreur temps réel:", err);
            setError("Erreur de chargement : " + err.message);
            setLoading(false);
          }
        );
        return () => unsubscribe();
      }, [listeActive]);

      useEffect(() => {
        loadPeople();
        loadIdentity();
        loadCodes();
        loadListes();
      }, []);

      // ---- HISTORIQUE ----
      function ajouterHistorique(action, details) {
        db.collection("historique").add({
          action,
          details,
          utilisateur: currentUser || "Inconnu",
          date: firebase.firestore.FieldValue.serverTimestamp(),
          liste: listeActive
        }).catch(e => console.error("Erreur historique:", e));
      }

      // ---- CRUD ITEMS ----
      async function ajouterItem(item) {
        try {
          const maxOrder = items.length > 0 ? Math.max(...items.map(i => i.order || 0)) : 0;
          const ref = db.collection("ideas").doc();
          await ref.set({
            ...item,
            id: ref.id,
            order: maxOrder + 1,
            liste: listeActive === "Toutes" ? "Général" : listeActive,
            commentaires: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          ajouterHistorique("ajout", `${item.titre} pour ${item.pour}`);
        } catch (e) {
          console.error("Erreur ajouterItem:", e);
          setError("Erreur d'ajout : " + e.message);
        }
      }

      async function modifierItem(id, data) {
        try {
          await db.collection("ideas").doc(id).update(data);
          ajouterHistorique("modification", `${data.titre || "un cadeau"} modifié`);
        } catch (e) {
          console.error("Erreur modifierItem:", e);
          setError("Erreur de modification : " + e.message);
        }
      }

      async function supprimerItem(id) {
        try {
          const item = items.find(i => i.id === id);
          await db.collection("ideas").doc(id).delete();
          if (item) ajouterHistorique("suppression", `${item.titre} supprimé`);
        } catch (e) {
          console.error("Erreur supprimerItem:", e);
          setError("Erreur de suppression : " + e.message);
        }
      }

      async function basculerVisibilite(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        const updated = { visible: !item.visible };
        try {
          await db.collection("ideas").doc(id).update(updated);
          ajouterHistorique("visibilite", `${item.titre} ${updated.visible ? "visible" : "caché"}`);
        } catch (e) {
          console.error("Erreur basculerVisibilite:", e);
          setError("Erreur de mise à jour : " + e.message);
        }
      }

      async function moveItem(id, direction) {
        const currentIndex = items.findIndex(i => i.id === id);
        const newIndex = currentIndex + direction;
        if (newIndex < 0 || newIndex >= items.length) return;

        const newItems = [...items];
        [newItems[currentIndex], newItems[newIndex]] = [newItems[newIndex], newItems[currentIndex]];

        try {
          const batch = db.batch();
          newItems.forEach((item, index) => {
            const ref = db.collection("ideas").doc(item.id);
            batch.update(ref, { order: index + 1 });
          });
          await batch.commit();
          setItems(newItems);
          ajouterHistorique("reorganisation", `Ordre modifié`);
        } catch (e) {
          console.error("Erreur moveItem:", e);
          setError("Erreur de réorganisation : " + e.message);
        }
      }

      // ---- RÉSERVATION ----
      async function reserverItem(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        const isReservedByMe = item.reservePar === currentUser;
        const updated = {
          reservePar: isReservedByMe ? null : currentUser
        };
        try {
          await db.collection("ideas").doc(id).update(updated);
          ajouterHistorique("reservation", `${item.titre} ${isReservedByMe ? "dé-reservé" : "réservé par " + currentUser}`);
        } catch (e) {
          console.error("Erreur reserverItem:", e);
          setError("Erreur de réservation : " + e.message);
        }
      }

      // ---- COMMENTAIRES ----
      async function ajouterCommentaire(id, texte) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        const commentaires = item.commentaires || [];
        const nouveau = {
          utilisateur: currentUser || "Inconnu",
          texte: texte,
          date: new Date().toISOString()
        };
        try {
          await db.collection("ideas").doc(id).update({
            commentaires: [...commentaires, nouveau]
          });
          ajouterHistorique("commentaire", `Commentaire sur ${item.titre}`);
        } catch (e) {
          console.error("Erreur ajouterCommentaire:", e);
          setError("Erreur d'ajout de commentaire : " + e.message);
        }
      }

      // ---- GESTION DES LISTES ----
      async function loadListes() {
        try {
          const doc = await db.collection("config").doc("listes").get();
          if (doc.exists && doc.data().values) {
            setListes(doc.data().values);
          }
        } catch (e) {}
      }

      async function saveListes(next) {
        try {
          await db.collection("config").doc("listes").set({ values: next });
          setListes(next);
        } catch (e) {
          setError("Erreur sauvegarde listes");
        }
      }

      function ajouterListe() {
        const name = newListe.trim();
        if (!name || listes.includes(name)) return;
        const next = [...listes, name];
        saveListes(next);
        setListeActive(name);
        setNewListe("");
        setAddingListe(false);
      }

      // ---- GESTION DES CODES ----
      async function loadCodes() {
        try {
          const doc = await db.collection("config").doc("codes").get();
          if (doc.exists) setCodes(doc.data().values || {});
        } catch (e) {}
      }

      async function saveCodes(next) {
        try {
          await db.collection("config").doc("codes").set({ values: next });
          setCodes(next);
        } catch (e) { setIdentityWarning(true); }
      }

      // ---- IDENTITÉ ----
      function loadIdentity() {
        try {
          const res = localStorage.getItem("current-user-name");
          if (res) setCurrentUser(res);
        } catch (e) {}
        setIdentityLoaded(true);
      }

      function persistIdentity(name) {
        setCurrentUser(name);
        try {
          if (name === null) localStorage.removeItem("current-user-name");
          else localStorage.setItem("current-user-name", name);
        } catch (e) { setIdentityWarning(true); }
      }

      // ---- PERSONNES ----
      function loadPeople() {
        try {
          const res = localStorage.getItem("gift-people");
          if (res) {
            const saved = JSON.parse(res);
            if (Array.isArray(saved) && saved.length) setPeople(saved);
          }
        } catch (e) {}
      }

      function savePeople(next) {
        setPeople(next);
        try {
          localStorage.setItem("gift-people", JSON.stringify(next));
        } catch (e) {
          setError("Erreur sauvegarde personnes");
        }
      }

      // ---- CODE ENTRY ----
      function startPickPerson(name) {
        if (name === currentUser) return;
        setPendingPerson(name);
        setCodeInput("");
        setCodeConfirmInput("");
        setCodeError("");
        setCodeMode(codes[name] ? "enter" : "create");
      }

      function cancelCodeEntry() {
        setPendingPerson(null);
        setCodeMode(null);
        setCodeInput("");
        setCodeConfirmInput("");
        setCodeError("");
      }

      function submitCode(e) {
        e.preventDefault();
        if (codeMode === "create") {
          if (!/^\d{4}$/.test(codeInput)) {
            setCodeError("4 chiffres requis.");
            return;
          }
          if (codeInput !== codeConfirmInput) {
            setCodeError("Les codes ne correspondent pas.");
            return;
          }
          const next = { ...codes, [pendingPerson]: codeInput };
          saveCodes(next);
          persistIdentity(pendingPerson);
          cancelCodeEntry();
        } else {
          if (codeInput === codes[pendingPerson]) {
            persistIdentity(pendingPerson);
            cancelCodeEntry();
          } else {
            setCodeError("Code incorrect.");
            setCodeInput("");
          }
        }
      }

      // ---- FORMULAIRE ----
      function handleAddPerson() {
        const name = newPerson.trim();
        if (!name) return setAddingPerson(false);
        if (!people.includes(name)) savePeople([...people, name]);
        setForm(f => ({ ...f, pour: name }));
        setNewPerson("");
        setAddingPerson(false);
      }

      function handlePhotoPick(file) {
        if (!file) return;
        setPhotoBusy(true);
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 1400;
            let { width, height } = img;
            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            let dataUrl = canvas.toDataURL("image/jpeg", 0.88);
            if (dataUrl.length > 4500000) dataUrl = canvas.toDataURL("image/jpeg", 0.6);
            setForm(f => ({ ...f, photos: [...f.photos, dataUrl] }));
            setPhotoBusy(false);
          };
          img.onerror = () => setPhotoBusy(false);
          img.src = reader.result;
        };
        reader.onerror = () => setPhotoBusy(false);
        reader.readAsDataURL(file);
      }

      function removePhoto(index) {
        setForm(f => ({
          ...f,
          photos: f.photos.filter((_, i) => i !== index)
        }));
      }

      function handleSubmit(e) {
        e.preventDefault();
        if (!form.titre.trim() || !form.pour.trim()) return;
        const data = {
          ...form,
          titre: form.titre.trim(),
          pour: form.pour.trim(),
          creePar: currentUser,
          prix: form.prix ? form.prix.trim() : ""
        };
        if (editingId) {
          modifierItem(editingId, data);
          setEditingId(null);
        } else {
          ajouterItem(data);
        }
        setForm({ titre: "", pour: "", photos: [], lien: "", note: "", visible: true, categorie: "", statut: "idee", prix: "" });
        setShowForm(false);
      }

      function ouvrirModification(item) {
        setForm({
          titre: item.titre,
          pour: item.pour,
          photos: item.photos || (item.photo ? [item.photo] : []),
          lien: item.lien || "",
          note: item.note || "",
          visible: item.visible !== false,
          categorie: item.categorie || "",
          statut: item.statut || "idee",
          prix: item.prix || ""
        });
        setEditingId(item.id);
        setShowForm(true);
      }

      // ---- STATISTIQUES ----
      function calculerStats() {
        const total = items.length;
        const parPersonne = {};
        const parCategorie = {};
        const parStatut = {};
        const surprises = items.filter(i => i.visible === false).length;
        const avecPhoto = items.filter(i => (i.photos && i.photos.length > 0) || i.photo).length;
        let totalPrix = 0;
        let prixParPersonne = {};

        items.forEach(i => {
          parPersonne[i.pour] = (parPersonne[i.pour] || 0) + 1;
          if (i.categorie) parCategorie[i.categorie] = (parCategorie[i.categorie] || 0) + 1;
          if (i.statut) parStatut[i.statut] = (parStatut[i.statut] || 0) + 1;

          if (i.prix) {
            const prix = parseFloat(i.prix.replace(",", "."));
            if (!isNaN(prix)) {
              totalPrix += prix;
              prixParPersonne[i.pour] = (prixParPersonne[i.pour] || 0) + prix;
            }
          }
        });

        return { total, parPersonne, parCategorie, parStatut, surprises, avecPhoto, totalPrix, prixParPersonne };
      }

      // ---- FILTRES + TRI ----
      const itemsFiltres = useMemo(() => {
        let result = items;

        if (filter !== "Tous") {
          result = result.filter(i => i.pour === filter);
        }

        if (recherche.trim()) {
          const search = recherche.trim().toLowerCase();
          result = result.filter(i =>
            i.titre.toLowerCase().includes(search) ||
            (i.note && i.note.toLowerCase().includes(search)) ||
            (i.categorie && i.categorie.toLowerCase().includes(search))
          );
        }

        if (filtreCategorie) {
          result = result.filter(i => i.categorie === filtreCategorie);
        }

        if (filtreStatut) {
          result = result.filter(i => i.statut === filtreStatut);
        }

        if (prixMin) {
          const min = parseFloat(prixMin.replace(",", "."));
          if (!isNaN(min)) {
            result = result.filter(i => {
              if (!i.prix) return false;
              const p = parseFloat(i.prix.replace(",", "."));
              return !isNaN(p) && p >= min;
            });
          }
        }
        if (prixMax) {
          const max = parseFloat(prixMax.replace(",", "."));
          if (!isNaN(max)) {
            result = result.filter(i => {
              if (!i.prix) return false;
              const p = parseFloat(i.prix.replace(",", "."));
              return !isNaN(p) && p <= max;
            });
          }
        }

        let triEffectif = tri;
        if (listeActive === "Toutes" && tri === "ordre") {
          triEffectif = "date-recent";
        }

        switch (triEffectif) {
          case "prix-croissant":
            result.sort((a, b) => {
              const pa = parseFloat((a.prix || "0").replace(",", "."));
              const pb = parseFloat((b.prix || "0").replace(",", "."));
              return (isNaN(pa) ? 0 : pa) - (isNaN(pb) ? 0 : pb);
            });
            break;
          case "prix-decroissant":
            result.sort((a, b) => {
              const pa = parseFloat((a.prix || "0").replace(",", "."));
              const pb = parseFloat((b.prix || "0").replace(",", "."));
              return (isNaN(pb) ? 0 : pb) - (isNaN(pa) ? 0 : pa);
            });
            break;
          case "date":
            result.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
            break;
          case "date-recent":
            result.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            break;
          case "alpha":
            result.sort((a, b) => a.titre.localeCompare(b.titre));
            break;
          case "ordre":
          default:
            result.sort((a, b) => (a.order || 0) - (b.order || 0));
            break;
        }

        return result;
      }, [items, filter, recherche, filtreCategorie, filtreStatut, prixMin, prixMax, tri, listeActive]);

      const categoriesDispo = useMemo(() => {
        const cats = new Set();
        items.forEach(i => {
          if (i.categorie) cats.add(i.categorie);
        });
        return Array.from(cats);
      }, [items]);

      // ---- STYLE ----
      const style = darkMode ? {
        bg: "#1a1a1a",
        card: "#2a2a2a",
        ink: "#f0f0f0",
        sub: "#aaa",
        line: "#444",
        rose: "#e07a6f",
        roseSoft: "#3a2a28",
        pine: "#6a9a7a",
        pineSoft: "#1a2a22",
        gold: "#d4a94a",
      } : PALETTE;

      const inputStyle = {
        width: "100%",
        boxSizing: "border-box",
        border: `1px solid ${style.line}`,
        borderRadius: 8,
        padding: "8px 10px",
        fontSize: 14,
        marginTop: 4,
        fontFamily: "inherit",
        color: style.ink,
        background: darkMode ? "#333" : "#FEFDFB",
      };

      // ---- RENDU ----
      return (
        <div style={{ minHeight: "100vh", background: style.bg, color: style.ink, fontFamily: "system-ui, sans-serif", transition: "all 0.3s" }}>
          <div style={{ maxWidth: 820, margin: "0 auto", padding: "36px 20px 60px" }}>
            <header style={{ marginBottom: 28 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, color: style.rose }}>
                  <span style={{ fontSize: 16 }}>✨</span>
                  <span style={{ fontSize: 12, letterSpacing: 1, textTransform: "uppercase", fontWeight: 600 }}>
                    Liste partagée
                  </span>
                </div>
                <button onClick={() => setDarkMode(!darkMode)} style={{
                  background: "transparent",
                  border: `1px solid ${style.line}`,
                  borderRadius: 999,
                  padding: "4px 12px",
                  fontSize: 12,
                  cursor: "pointer",
                  color: style.ink,
                }}>
                  {darkMode ? "☀️ Clair" : "🌙 Sombre"}
                </button>
              </div>
              <h1 style={{ fontFamily: "Georgia, serif", fontSize: 32, color: style.ink, margin: "6px 0 8px", lineHeight: 1.15 }}>
                Idées cadeaux
              </h1>
              <p style={{ color: style.sub, fontSize: 14, marginTop: 4 }}>
                Ajoutez, modifiez, réorganisez. Les surprises restent cachées à leurs destinataires.
              </p>
            </header>

            {/* LISTES */}
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16, alignItems: "center" }}>
              <button
                onClick={() => setListeActive("Toutes")}
                style={{
                  border: `1px solid ${listeActive === "Toutes" ? style.rose : style.line}`,
                  borderRadius: 999,
                  padding: "4px 12px",
                  fontSize: 12,
                  fontWeight: 600,
                  cursor: "pointer",
                  background: listeActive === "Toutes" ? style.rose : "transparent",
                  color: listeActive === "Toutes" ? "#fff" : style.ink,
                }}
              >
                📋 Toutes
              </button>
              {listes.map(l => (
                <button key={l} onClick={() => setListeActive(l)} style={{
                  border: `1px solid ${listeActive === l ? style.rose : style.line}`,
                  borderRadius: 999,
                  padding: "4px 12px",
                  fontSize: 12,
                  fontWeight: 600,
                  cursor: "pointer",
                  background: listeActive === l ? style.rose : "transparent",
                  color: listeActive === l ? "#fff" : style.ink,
                }}>{l}</button>
              ))}
              {addingListe ? (
                <div style={{ display: "flex", gap: 4 }}>
                  <input autoFocus value={newListe} onChange={e => setNewListe(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && ajouterListe()}
                    placeholder="Nom" style={{ ...inputStyle, marginTop: 0, width: 100, padding: "4px 8px", fontSize: 12 }} />
                  <button onClick={ajouterListe} style={{
                    border: "none",
                    borderRadius: 8,
                    padding: "0 8px",
                    background: style.ink,
                    color: "#fff",
                    cursor: "pointer",
                  }}>OK</button>
                </div>
              ) : (
                <button onClick={() => setAddingListe(true)} style={{
                  border: `1px dashed ${style.line}`,
                  borderRadius: 999,
                  padding: "4px 12px",
                  fontSize: 12,
                  cursor: "pointer",
                  background: "transparent",
                  color: style.sub,
                }}>➕ Liste</button>
              )}
            </div>

            {/* IDENTITÉ */}
            {identityLoaded && (
              <div style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                flexWrap: "wrap",
                background: style.card,
                border: `1px solid ${style.line}`,
                borderRadius: 12,
                padding: "10px 14px",
                marginBottom: 20,
                fontSize: 13,
              }}>
                <span style={{ color: style.sub }}>Tu es :</span>
                {people.map(p => {
                  const active = currentUser === p;
                  const theme = themeFor(p);
                  return (
                    <button key={p} onClick={() => startPickPerson(p)} style={{
                      border: `1px solid ${active ? theme.main : style.line}`,
                      borderRadius: 999,
                      padding: "5px 12px",
                      fontSize: 13,
                      fontWeight: 600,
                      cursor: "pointer",
                      background: active ? theme.main : "transparent",
                      color: active ? "#fff" : style.ink,
                    }}>{p}</button>

                {currentUser && !identityWarning && (
                  <span style={{ color: style.sub, fontSize: 12, marginLeft: "auto" }}>
                    <button onClick={() => persistIdentity(null)} style={{
                      background: "transparent",
                      border: "none",

                      fontSize: 12,
                      cursor: "pointer",

                  </span>
                )}
              </div>
            )}

            {/* CODE ENTRY */}
            {pendingPerson && (
              <form onSubmit={submitCode} style={{
                background: style.card,
                border: `1px solid ${style.line}`,
                borderRadius: 12,
                padding: "14px 16px",
                marginBottom: 20,
                display: "grid",
                gap: 10,
              }}>
                <div style={{ fontSize: 13, fontWeight: 600 }}>
                  {codeMode === "create" ? `Crée un code pour ${pendingPerson}` : `Code de ${pendingPerson}`}
                </div>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  <input autoFocus type="password" inputMode="numeric" maxLength={4}
                    value={codeInput} onChange={e => setCodeInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
                    placeholder="Code" style={{ ...inputStyle, marginTop: 0, width: 90, letterSpacing: 4, textAlign: "center" }} />
                  {codeMode === "create" && (
                    <input type="password" inputMode="numeric" maxLength={4}
                      value={codeConfirmInput} onChange={e => setCodeConfirmInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
                      placeholder="Confirme" style={{ ...inputStyle, marginTop: 0, width: 90, letterSpacing: 4, textAlign: "center" }} />
                  )}
                </div>
                {codeError && <div style={{ fontSize: 12, color: style.rose }}>{codeError}</div>}
                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                  <button type="button" onClick={cancelCodeEntry} style={{
                    background: "transparent", border: "none", color: style.sub, fontSize: 13, cursor: "pointer"
                  }}>Annuler</button>
                  <button type="submit" style={{
                    background: style.ink, color: "#fff", border: "none", borderRadius: 999,
                    padding: "8px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer",
                  }}>{codeMode === "create" ? "Créer" : "Valider"}</button>
                </div>
              </form>
            )}

            {error && <div style={{ background: style.roseSoft, color: style.rose, padding: "10px 14px", borderRadius: 10, marginBottom: 16 }}>{error}</div>}

            {/* ACTIONS */}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20, alignItems: "center" }}>
              <button onClick={() => {
                setEditingId(null);
                setForm({ titre: "", pour: "", photos: [], lien: "", note: "", visible: true, categorie: "", statut: "idee", prix: "" });
                setShowForm(true);
              }} style={{
                background: style.ink,
                color: "#fff",
                border: "none",
                borderRadius: 999,
                padding: "9px 16px",
                fontSize: 13,
                display: "flex",
                alignItems: "center",
                gap: 6,
                cursor: "pointer",
                fontWeight: 600,
              }}>➕ Ajouter</button>

              <button onClick={() => setShowStats(!showStats)} style={{
                background: "transparent",
                border: `1px solid ${style.line}`,
                borderRadius: 999,
                padding: "8px 14px",
                fontSize: 13,
                cursor: "pointer",
                color: style.ink,
              }}>📊 Stats</button>

              {people.length > 0 && (
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginLeft: 4 }}>
                  {["Tous", ...people].map(p => {
                    const active = filter === p;
                    const theme = p === "Tous" ? { main: style.ink, soft: style.line } : themeFor(p);
                    return (
                      <button key={p} onClick={() => setFilter(p)} style={{
                        border: "none",
                        cursor: "pointer",
                        borderRadius: 999,
                        padding: "6px 12px",
                        fontSize: 12,
                        fontWeight: 600,
                        background: active ? theme.main : "transparent",
                        color: active ? "#fff" : style.ink,
                        border: active ? "none" : `1px solid ${style.line}`,
                      }}>{p}</button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* 🔍 BARRE DE RECHERCHE + FILTRES + TRI */}
            <div style={{
              background: style.card,
              border: `1px solid ${style.line}`,
              borderRadius: 12,
              padding: "12px 14px",
              marginBottom: 16,
              display: "grid",
              gap: 8,
            }}>
              <input
                type="text"
                placeholder="🔍 Rechercher un cadeau, une catégorie..."
                value={recherche}
                onChange={e => setRecherche(e.target.value)}
                style={inputStyle}
              />
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <select value={filtreCategorie} onChange={e => setFiltreCategorie(e.target.value)} style={inputStyle}>
                  <option value="">Toutes catégories</option>
                  {categoriesDispo.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <select value={filtreStatut} onChange={e => setFiltreStatut(e.target.value)} style={inputStyle}>
                  <option value="">Tous statuts</option>
                  <option value="idee">💡 Idée</option>
                  <option value="commande">🛒 Commandé</option>
                  <option value="offert">🎁 Offert</option>
                  <option value="abandonne">❌ Abandonné</option>
                </select>
                <input type="number" placeholder="Prix min" value={prixMin} onChange={e => setPrixMin(e.target.value)} style={{ ...inputStyle, width: 90 }} />
                <input type="number" placeholder="Prix max" value={prixMax} onChange={e => setPrixMax(e.target.value)} style={{ ...inputStyle, width: 90 }} />
                <select value={tri} onChange={e => setTri(e.target.value)} style={inputStyle}>
                  <option value="ordre">📋 Ordre</option>
                  <option value="prix-croissant">💰 Prix +</option>
                  <option value="prix-decroissant">💰 Prix -</option>
                  <option value="date">📅 Ancien</option>
                  <option value="date-recent">📅 Récent</option>
                  <option value="alpha">🔤 Alphabétique</option>
                </select>
                <button onClick={() => {
                  setRecherche("");
                  setFiltreCategorie("");
                  setFiltreStatut("");
                  setPrixMin("");
                  setPrixMax("");
                  setTri("ordre");
                }} style={{
                  background: "transparent",
                  border: `1px solid ${style.line}`,
                  borderRadius: 8,
                  padding: "6px 12px",
                  fontSize: 12,
                  cursor: "pointer",
                  color: style.sub,
                }}>🔄 Réinitialiser</button>
              </div>
            </div>

            {/* STATISTIQUES */}
            {showStats && (
              <div style={{
                background: style.card,
                border: `1px solid ${style.line}`,
                borderRadius: 14,
                padding: 16,
                marginBottom: 20,
                display: "grid",
                gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))",
                gap: 8,
              }}>
                {(() => {
                  const stats = calculerStats();
                  return (
                    <>
                      <div><strong>Total</strong><br/>{stats.total}</div>
                      <div><strong>Surprises</strong><br/>{stats.surprises}</div>
                      <div><strong>Avec photo</strong><br/>{stats.avecPhoto}</div>
                      <div><strong>💰 Total</strong><br/>{stats.totalPrix.toFixed(2)} €</div>
                      {Object.keys(stats.prixParPersonne).length > 0 && (
                        <div><strong>💰 Par personne</strong><br/>{Object.entries(stats.prixParPersonne).map(([k,v]) => `${k}: ${v.toFixed(2)}€`).join(", ")}</div>
                      )}
                      <div><strong>Par personne</strong><br/>{Object.entries(stats.parPersonne).map(([k,v]) => `${k}: ${v}`).join(", ")}</div>
                      {Object.keys(stats.parCategorie).length > 0 && (
                        <div><strong>Catégories</strong><br/>{Object.entries(stats.parCategorie).map(([k,v]) => `${k}: ${v}`).join(", ")}</div>
                      )}
                      <div><strong>Statuts</strong><br/>{Object.entries(stats.parStatut).map(([k,v]) => `${k}: ${v}`).join(", ")}</div>
                    </>
                  );
                })()}
              </div>
            )}

            {/* FORMULAIRE */}
            {showForm && (
              <form onSubmit={handleSubmit} style={{
                background: style.card,
                border: `1px solid ${style.line}`,
                borderRadius: 14,
                padding: 18,
                marginBottom: 24,
                display: "grid",
                gap: 10,
              }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Nom *</label>
                    <input required value={form.titre} onChange={e => setForm({ ...form, titre: e.target.value })}
                      placeholder="Ex. Enceinte" style={inputStyle} />
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Pour *</label>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
                      {people.map(p => {
                        const active = form.pour === p;
                        const theme = themeFor(p);
                        return (
                          <button key={p} type="button" onClick={() => setForm({ ...form, pour: p })} style={{
                            border: `1px solid ${active ? theme.main : style.line}`,
                            borderRadius: 8,
                            padding: "6px 10px",
                            fontSize: 13,
                            fontWeight: 600,
                            cursor: "pointer",
                            background: active ? theme.main : "transparent",
                            color: active ? "#fff" : style.ink,
                          }}>{p}</button>
                        );
                      })}
                      {addingPerson ? (
                        <div style={{ display: "flex", gap: 4 }}>
                          <input autoFocus value={newPerson} onChange={e => setNewPerson(e.target.value)}
                            onKeyDown={e => e.key === "Enter" && handleAddPerson()}
                            placeholder="Prénom" style={{ ...inputStyle, marginTop: 0, width: 100, padding: "4px 8px" }} />
                          <button type="button" onClick={handleAddPerson} style={{
                            border: "none", borderRadius: 8, padding: "0 10px",
                            background: style.ink, color: "#fff", cursor: "pointer",
                          }}>OK</button>
                        </div>
                      ) : (
                        <button type="button" onClick={() => setAddingPerson(true)} style={{
                          border: `1px dashed ${style.line}`, borderRadius: 8,
                          padding: "6px 10px", background: "transparent",
                          color: style.sub, cursor: "pointer",
                        }}>👤➕</button>
                      )}
                    </div>
                  </div>
                </div>

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>💰 Prix (€)</label>
                    <input
                      type="text"
                      inputMode="decimal"
                      value={form.prix}
                      onChange={e => setForm({ ...form, prix: e.target.value })}
                      placeholder="49.99"
                      style={inputStyle}
                    />
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Catégorie</label>
                    <input value={form.categorie} onChange={e => setForm({ ...form, categorie: e.target.value })}
                      placeholder="Tech, Mode..." style={inputStyle} />
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: style.sub }}>Statut</label>
                    <select value={form.statut} onChange={e => setForm({ ...form, statut: e.target.value })}
                      style={{ ...inputStyle, marginTop: 4 }}>
                      <option value="idee">💡 Idée</option>
                      <option value="commande">🛒 Commandé</option>
                      <option value="offert">🎁 Offert</option>
                      <option value="abandonne">❌ Abandonné</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label style={{ fontSize: 12, color: style.sub }}>🖼️ Photos</label>
                  <input type="file" accept="image/*" onChange={e => handlePhotoPick(e.target.files[0])}
                    style={{ ...inputStyle, padding: "6px 8px" }} />
                  {photoBusy && <div style={{ fontSize: 11, color: style.sub }}>Traitement...</div>}
                  {form.photos.length > 0 && (
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
                      {form.photos.map((p, idx) => (
                        <div key={idx} style={{ position: "relative" }}>
                          <img src={p} style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 8, border: `1px solid ${style.line}` }} />
                          <button type="button" onClick={() => removePhoto(idx)} style={{
                            position: "absolute",
                            top: -6,
                            right: -6,
                            background: style.rose,
                            color: "#fff",
                            border: "none",
                            borderRadius: 999,
                            width: 18,
                            height: 18,
                            fontSize: 12,
                            cursor: "pointer",
                            lineHeight: "18px",
                            textAlign: "center",
                            padding: 0,
                          }}>×</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div>
                  <label style={{ fontSize: 12, color: style.sub }}>🔗 Lien</label>
                  <input value={form.lien} onChange={e => setForm({ ...form, lien: e.target.value })}
                    placeholder="https://..." style={inputStyle} />
                </div>

                <div>
                  <label style={{ fontSize: 12, color: style.sub }}>Note</label>
                  <textarea value={form.note} onChange={e => setForm({ ...form, note: e.target.value })}
                    rows={2} style={{ ...inputStyle, resize: "vertical" }} />
                </div>

                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer" }}>
                  <input type="checkbox" checked={!form.visible} onChange={e => setForm({ ...form, visible: !e.target.checked })} />
                  Garder la surprise (caché à {form.pour || "la personne"})
                </label>

                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 4 }}>
                  <button type="button" onClick={() => {
                    setShowForm(false);
                    setEditingId(null);
                  }} style={{
                    background: "transparent", border: "none", color: style.sub, fontSize: 13, cursor: "pointer"
                  }}>Annuler</button>
                  <button type="submit" style={{
                    background: style.rose,
                    color: "#fff",
                    border: "none",
                    borderRadius: 999,
                    padding: "8px 16px",
                    fontSize: 13,
                    fontWeight: 600,
                    cursor: "pointer",
                  }}>{editingId ? "Modifier" : "Ajouter"}</button>
                </div>
              </form>
            )}

            {/* LISTE */}
            {loading ? (
              <div style={{ color: style.sub }}>Chargement...</div>
            ) : itemsFiltres.length === 0 ? (
              <div style={{
                textAlign: "center",
                padding: "50px 20px",
                color: style.sub,
                border: `1px dashed ${style.line}`,
                borderRadius: 14,
              }}>
                <div style={{ fontSize: 40 }}>🎁</div>
                <div style={{ fontSize: 14 }}>Aucun cadeau trouvé. {items.length === 0 ? "Ajoute la première idée !" : "Ajuste tes filtres."}</div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 16 }}>
                {itemsFiltres.map(item => (
                  <GiftTag
                    key={item.id}
                    item={item}
                    onDelete={supprimerItem}
                    onToggleVisible={basculerVisibilite}
                    onOpenPhoto={(src, titre) => setLightbox({ src, titre })}
                    currentUser={currentUser}
                    onEdit={ouvrirModification}
                    onMove={moveItem}
                    onReserver={reserverItem}
                    onAddComment={ajouterCommentaire}
                    inputStyle={inputStyle}
                  />
                ))}
              </div>
            )}
          </div>

          {/* LIGHTBOX */}
          {lightbox && (
            <div onClick={() => setLightbox(null)} style={{
              position: "fixed",
              inset: 0,
              background: "rgba(0,0,0,0.9)",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              zIndex: 1000,
              padding: 20,
              cursor: "zoom-out",
            }}>
              <img src={lightbox.src} alt={lightbox.titre} style={{
                maxWidth: "100%",
                maxHeight: "80vh",
                borderRadius: 10,
                boxShadow: "0 10px 40px rgba(0,0,0,0.5)",
              }} />
              <div style={{ color: "#fff", marginTop: 14 }}>{lightbox.titre}</div>
              <button onClick={() => setLightbox(null)} style={{
                position: "absolute",
                top: 18,
                right: 18,
                background: "rgba(255,255,255,0.12)",
                border: "none",
                color: "#fff",
                borderRadius: 999,
                width: 34,
                height: 34,
                fontSize: 18,
                cursor: "pointer",
              }}>×</button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GiftList />);
  </script>
</body>
</html>
